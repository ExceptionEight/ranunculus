[package]
name = "ranunculus-server"
description = "The server side of Ranunculus: the stations' sessions, the dialog, tools and the services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ranunculus-proto = { path = "../crates/proto" }
ranunculus-vad = { path = "../crates/vad" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] } # tool JSON keeps the order it was written in: the model reads it
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "process", "fs", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "stream", "multipart"] } # rustls on ring: main.rs installs it
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10" # the home's time zone by its name («Europe/Moscow»)
rusqlite = { version = "0.41", features = ["bundled", "functions"] } # SQLite with FTS5; functions: days and hours in the home's time zone
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] } # the web UI (web/)
argon2 = "0.6" # the web UI's passwords (web/auth.rs): Argon2id, OWASP's parameters (the crate's defaults)
ring = { version = "0.17", default-features = false } # already under rustls: sessions' random tokens and their SHA-256
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] } # the server's own certificate, made at the first start
time = { version = "0.3", default-features = false, features = ["std"] } # rcgen's dates
rpassword = "7" # `ranunculus-server password`: read from the terminal without echo
openidconnect = { version = "4", default-features = false } # signing in by an OIDC provider (web/oidc.rs): discovery, PKCE, the ID token checked
