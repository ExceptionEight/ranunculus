# SearXNG for Ranunculus's web_search tool: on top of its defaults, JSON output for the server and Russian results.
# Reached only by the server inside the Compose network.
use_default_settings: true
general:
  instance_name: "ranunculus"
server:
  limiter: false
  image_proxy: false
  method: "GET"
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru"
  formats:
    - html
    - json
