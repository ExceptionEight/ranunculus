[package]
name = "ranunculus-station"
description = "The station side of Ranunculus: microphone, playback, panel, volume and buttons, connected to the server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ranunculus-proto = { path = "../crates/proto" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync", "process", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
libc = "0.2"
rustfft = "6.2"
