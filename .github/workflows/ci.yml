# Every push and pull request: the tests, the linters, and the whole thing built from source on both architectures
# and talked to once (tools/e2e.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          # the station's own architecture: its client's tests run as they will on a station
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: ffmpeg (the server decodes sounds with it, and a test checks that)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  services:
    name: Services and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.4
      - run: ruff check services tools
      - run: ruff format --check services tools
      - run: pip install -r services/tts/requirements.txt
      - run: python -m unittest discover -s services/tts -p 'test_*.py'
      - run: shellcheck station/install.sh tools/version.sh
      - name: One version everywhere
        run: tools/version.sh

  stack:
    name: Built from source and talked to (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Build every image
        run: docker compose --profile memory build
      - name: Start (recognition and the voice download their models)
        run: docker compose -f compose.yaml -f tools/e2e.compose.yaml up -d --wait --wait-timeout 1200
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: A conversation, end to end
        run: |
          pip install numpy websockets
          python tools/e2e.py --token "$(docker compose exec -T server cat data/token)" --tts http://127.0.0.1:47711
      - name: What the services said
        if: failure()
        run: docker compose logs --no-color --tail 200
