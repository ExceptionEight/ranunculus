# A tag vX.Y.Z: the images of that version for amd64 and arm64, each built on a machine of its own architecture,
# pushed to ghcr.io/exceptioneight/ranunculus-<part> as X.Y.Z and latest, and a release on GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/exceptioneight

jobs:
  version:
    name: The tag is the version in the tree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(tools/version.sh)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag is $GITHUB_REF_NAME, the tree is $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.part }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        part: [server, asr, tts, music, pages, embeddings]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          # the server is built from the whole tree, a service from its own folder
          context: ${{ matrix.part == 'server' && '.' || format('services/{0}', matrix.part) }}
          file: ${{ matrix.part == 'server' && 'server/Dockerfile' || format('services/{0}/Dockerfile', matrix.part) }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.REGISTRY }}/ranunculus-${{ matrix.part }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the list of both architectures
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.part }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.part }} for both architectures
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        part: [server, asr, tts, music, pages, embeddings]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.part }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One name for both
        working-directory: digests
        run: |
          image=$REGISTRY/ranunculus-${{ matrix.part }}
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest" $(printf "$image@sha256:%s " *)
        env:
          VERSION: ${{ needs.version.outputs.version }}

  release:
    name: The release on GitHub
    needs: [version, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
